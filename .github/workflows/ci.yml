name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt'ed:"; echo "$unformatted"; exit 1; fi

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

      # A few seconds of every fuzz target; the nightly Fuzz workflow runs longer.
      - name: Fuzz (short)
        run: scripts/fuzz.sh 10s

      - name: Cross-build
        env:
          CGO_ENABLED: "0"
        run: |
          for pkg in . ./cmd/gnss_ptp_clockclass; do
            GOOS=linux GOARCH=amd64 go build -o /dev/null "$pkg"
            GOOS=linux GOARCH=arm64 go build -o /dev/null "$pkg"
            GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null "$pkg"
          done

      - name: Release archives (dry run)
        run: |
          scripts/dist.sh 0.0.0-ci
          tar -tzf dist/gnss_ptp_exporter-0.0.0-ci.linux-arm64.tar.gz | grep -qx 'gnss_ptp_exporter-0.0.0-ci.linux-arm64/gnss_ptp_exporter'
          tar -tzf dist/gnss_ptp_clockclass-0.0.0-ci.linux-arm64.tar.gz | grep -qx 'gnss_ptp_clockclass-0.0.0-ci.linux-arm64/gnss_ptp_clockclass'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
