name: Fuzz

# Longer runs of the Go native fuzz targets (every parser of untrusted
# input: gpsd JSON, UBX frames, ts2phc log lines, ptp4l management
# responses, GRANDMASTER_SETTINGS_NP, chrony output, the clockClass state
# file). CI runs the same targets for a few seconds. A crash leaves the
# failing input as an artifact; commit it under testdata/fuzz/ as a
# regression test.

on:
  schedule:
    - cron: "23 1 * * *"      # nightly, 01:23 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Duration per fuzz target"
        default: "5m"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Fuzz
        run: scripts/fuzz.sh "${FUZZTIME}"
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}

      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: |
            internal/*/testdata/fuzz/
            cmd/*/internal/*/testdata/fuzz/
